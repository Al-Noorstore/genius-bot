plugins { id 'com.android.application' }
android {
    namespace 'com.alnoor.autobot'
    compileSdk 34
    defaultConfig {
        applicationId "com.alnoor.geniusbot"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0-test"
    }
    signingConfigs {
        release {
            storeFile rootProject.file("genius.p12")
            storePassword "genius2026"
            keyAlias "geniusbot"
            keyPassword "genius2026"
            storeType "PKCS12"
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
